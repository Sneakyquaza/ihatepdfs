<VirtualHost *:80>
    ServerName ihatepdfs.oryx3.fr

    # Next.js app (docker compose, bound to localhost). Long timeout for OCR / Office conversions.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3000/ timeout=600
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    # Real client IP for API rate limiting; "set" overwrites any client-supplied value.
    RequestHeader set X-Client-IP "%{REMOTE_ADDR}s"

    LimitRequestBody 157286400

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    ErrorLog ${APACHE_LOG_DIR}/ihatepdfs_error.log
    CustomLog ${APACHE_LOG_DIR}/ihatepdfs_access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =ihatepdfs.oryx3.fr
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
