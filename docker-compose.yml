# Bounded container logs (json-file grows forever otherwise)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: ./api
    environment:
      MAX_UPLOAD_MB: "100"
      MAX_HEAVY_JOBS: "4"
      MAX_QUEUE: "20"
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_S: "600"
      RATE_LIMIT_CONCURRENT: "3"
    tmpfs:
      - /tmp:size=4g
    mem_limit: 8g
    cpus: 6
    networks: [default, render]
    depends_on:
      - render
    restart: unless-stopped
    logging: *logging

  # Headless Chromium for HTML/URL -> PDF. Renders untrusted pages, so: no access to the API's files,
  # read-only root, no capabilities, own network (internet egress only via its IP-pinning filter).
  render:
    build: ./render
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/pwuser:size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    networks: [render]
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

networks:
  render:
