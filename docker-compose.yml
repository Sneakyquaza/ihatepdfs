# Bounded container logs (json-file grows forever otherwise)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: ./api
    environment:
      MAX_UPLOAD_MB: "100"
      MAX_HEAVY_JOBS: "4"
      MAX_QUEUE: "20"
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_S: "600"
      RATE_LIMIT_CONCURRENT: "3"
    tmpfs:
      - /tmp:size=4g
    mem_limit: 8g
    cpus: 6
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging
